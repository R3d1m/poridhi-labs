<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e5b"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9972b"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b6fd4"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker><style>.flow{stroke-dasharray:7 6;animation:dash 0.9s linear infinite}@keyframes dash{to{stroke-dashoffset:-13}}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}</style></defs><rect width="760" height="330" fill="#fff" stroke="#222" stroke-width="2"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#111">Notice a change, then respond</text><text x="40" y="60" text-anchor="start" font-size="12" fill="#3b6fd4" font-weight="600">DETECTION</text><rect x="40" y="70" width="190" height="60" rx="9" fill="#e9f0fc" stroke="#3b6fd4" stroke-width="2"/><text x="135.0" y="96.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Settings baseline</text><text x="135.0" y="112.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">sha256 + server list saved</text><rect class="pulse" x="285" y="70" width="190" height="60" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/><text x="380.0" y="96.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Fingerprint check</text><text x="380.0" y="112.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">hash mismatch</text><rect class="pulse" x="530" y="70" width="190" height="60" rx="9" fill="#fdecec" stroke="#d64545" stroke-width="2"/><text x="625.0" y="96.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Unknown MCP server</text><text x="625.0" y="112.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">&quot;extra&quot; appears</text><line class="flow" x1="230" y1="100" x2="285" y2="100" stroke="#3b6fd4" stroke-width="2.2" marker-end="url(#m-blue)"/><line class="flow" x1="475" y1="100" x2="530" y2="100" stroke="#d9972b" stroke-width="2.2" marker-end="url(#m-amber)"/><text x="20" y="190" text-anchor="start" font-size="12" fill="#d64545" font-weight="600">INCIDENT RESPONSE (read right to left)</text><rect x="612" y="205" width="128" height="60" rx="9" fill="#e8f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="676.0" y="231.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">1. Contain</text><text x="676.0" y="247.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">stop sessions</text><rect x="464" y="205" width="128" height="60" rx="9" fill="#e8f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="528.0" y="231.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">2. Preserve</text><text x="528.0" y="247.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">copy evidence</text><rect x="316" y="205" width="128" height="60" rx="9" fill="#e8f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="380.0" y="231.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">3. Rotate</text><text x="380.0" y="247.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">credentials</text><rect x="168" y="205" width="128" height="60" rx="9" fill="#e8f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="232.0" y="231.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">4. Report</text><text x="232.0" y="247.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">security team</text><rect x="20" y="205" width="128" height="60" rx="9" fill="#e8f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="84.0" y="231.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">5. Review</text><text x="84.0" y="247.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">fix the gap</text><line class="flow" x1="612" y1="235" x2="592" y2="235" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#m-green)"/><line class="flow" x1="464" y1="235" x2="444" y2="235" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#m-green)"/><line class="flow" x1="316" y1="235" x2="296" y2="235" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#m-green)"/><line class="flow" x1="168" y1="235" x2="148" y2="235" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#m-green)"/><line class="flow" x1="625" y1="130" x2="676" y2="205" stroke="#d64545" stroke-width="2.2" marker-end="url(#m-red)"/><text x="380" y="306" text-anchor="middle" font-size="12" fill="#444" font-weight="600" font-style="italic">Assume anything the agent could read has been seen, and rotate it.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>