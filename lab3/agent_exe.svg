<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e5b"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9972b"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b6fd4"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker><style>.flow{stroke-dasharray:7 6;animation:dash 0.9s linear infinite}@keyframes dash{to{stroke-dashoffset:-13}}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}</style></defs><rect width="760" height="350" fill="#fff" stroke="#222" stroke-width="2"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#111">How Gemini CLI limits what the agent can do</text><rect x="20" y="70" width="100" height="60" rx="9" fill="#f4f4f2" stroke="#444" stroke-width="2"/><text x="70.0" y="96.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Prompt or</text><text x="70.0" y="112.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">hostile README</text><rect x="144" y="70" width="100" height="60" rx="9" fill="#e9f0fc" stroke="#3b6fd4" stroke-width="2"/><text x="194.0" y="96.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Gemini CLI</text><text x="194.0" y="112.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">the intern</text><rect x="268" y="70" width="100" height="60" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/><text x="318.0" y="96.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Folder Trust</text><text x="318.0" y="112.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">trusted?</text><rect x="392" y="70" width="100" height="60" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/><text x="442.0" y="96.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Policy Engine</text><text x="442.0" y="112.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">deny / ask / allow</text><rect x="516" y="70" width="100" height="60" rx="9" fill="#e8f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="566.0" y="96.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Sandbox</text><text x="566.0" y="112.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">docker</text><rect x="640" y="70" width="100" height="60" rx="9" fill="#f4f4f2" stroke="#444" stroke-width="2"/><text x="690.0" y="96.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Shell and</text><text x="690.0" y="112.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">files</text><line class="flow" x1="120" y1="100" x2="144" y2="100" stroke="#444" stroke-width="2.2" marker-end="url(#m-gray)"/><line class="flow" x1="244" y1="100" x2="268" y2="100" stroke="#444" stroke-width="2.2" marker-end="url(#m-gray)"/><line class="flow" x1="368" y1="100" x2="392" y2="100" stroke="#444" stroke-width="2.2" marker-end="url(#m-gray)"/><line class="flow" x1="492" y1="100" x2="516" y2="100" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#m-green)"/><line class="flow" x1="616" y1="100" x2="640" y2="100" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#m-green)"/><line class="flow" x1="442" y1="130" x2="320" y2="220" stroke="#d64545" stroke-width="2.2" marker-end="url(#m-red)"/><line class="flow" x1="442" y1="130" x2="480" y2="220" stroke="#d9972b" stroke-width="2.2" marker-end="url(#m-amber)"/><line class="flow" x1="442" y1="130" x2="640" y2="220" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#m-green)"/><rect x="250" y="220" width="140" height="50" rx="9" fill="#fdecec" stroke="#d64545" stroke-width="2"/><text x="320.0" y="241.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">rm -rf /tmp/x</text><text x="320.0" y="257.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">DENY</text><rect x="410" y="220" width="140" height="50" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/><text x="480.0" y="241.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">git push</text><text x="480.0" y="257.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">ASK YOU</text><rect x="570" y="220" width="140" height="50" rx="9" fill="#e8f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="640.0" y="241.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">git status</text><text x="640.0" y="257.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#111">ALLOW</text><text x="380" y="312" text-anchor="middle" font-size="12" fill="#444" font-weight="600" font-style="italic">Every tool call passes through these layers. The highest-priority matching rule wins:</text><text x="380" y="332" text-anchor="middle" font-size="12" fill="#444" font-weight="600" font-style="italic">deny (200) &gt; ask (150) &gt; allow (100)</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>